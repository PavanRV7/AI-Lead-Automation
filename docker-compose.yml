services:

  postgres:
    image: postgres:16
    container_name: lead_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadadmin
      POSTGRES_PASSWORD: leadpassword
      POSTGRES_DB: lead_automation
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:latest
    container_name: lead_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: lead_automation
      DB_POSTGRESDB_USER: leadadmin
      DB_POSTGRESDB_PASSWORD: leadpassword
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres

volumes:
  postgres_data:
  n8n_data: